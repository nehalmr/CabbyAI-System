apiVersion: v1
kind: Namespace
metadata:
  name: cabbyai
---
apiVersion: v1
kind: Secret
metadata:
  name: cabbyai-secrets
  namespace: cabbyai
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: change-me
  JWT_SECRET: change-me-to-a-32-byte-secret
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cabbyai-config
  namespace: cabbyai
data:
  EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
  SPRING_CLOUD_CONFIG_URI: http://config-server:8888
  SPRING_DATASOURCE_USERNAME: root
  SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/cabbyai_user_db
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: cabbyai
spec:
  selector:
    matchLabels: { app: mysql }
  template:
    metadata: { labels: { app: mysql } }
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports: [{ containerPort: 3306 }]
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: cabbyai-secrets, key: MYSQL_ROOT_PASSWORD } }
          volumeMounts: [{ name: data, mountPath: /var/lib/mysql }]
      volumes: [{ name: data, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: cabbyai
spec:
  selector: { app: mysql }
  ports: [{ port: 3306, targetPort: 3306 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: security-service
  namespace: cabbyai
spec:
  replicas: 2
  selector:
    matchLabels: { app: security-service }
  template:
    metadata: { labels: { app: security-service } }
    spec:
      containers:
        - name: security-service
          image: ghcr.io/your-org/cabbyai-security-service:latest
          ports: [{ containerPort: 8086 }]
          env:
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: cabbyai-secrets, key: JWT_SECRET } }
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8086 }
---
apiVersion: v1
kind: Service
metadata:
  name: security-service
  namespace: cabbyai
spec:
  selector: { app: security-service }
  ports: [{ port: 8086, targetPort: 8086 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: cabbyai
spec:
  replicas: 2
  selector:
    matchLabels: { app: user-service }
  template:
    metadata: { labels: { app: user-service } }
    spec:
      containers:
        - name: user-service
          image: ghcr.io/your-org/cabbyai-user-service:latest
          ports: [{ containerPort: 8081 }]
          envFrom: [{ configMapRef: { name: cabbyai-config } }]
          env:
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom: { secretKeyRef: { name: cabbyai-secrets, key: MYSQL_ROOT_PASSWORD } }
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8081 }
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: cabbyai
spec:
  selector: { app: user-service }
  ports: [{ port: 8081, targetPort: 8081 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: cabbyai
spec:
  replicas: 2
  selector:
    matchLabels: { app: api-gateway }
  template:
    metadata: { labels: { app: api-gateway } }
    spec:
      containers:
        - name: api-gateway
          image: ghcr.io/your-org/cabbyai-api-gateway:latest
          ports: [{ containerPort: 8080 }]
          envFrom: [{ configMapRef: { name: cabbyai-config } }]
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: cabbyai
spec:
  type: LoadBalancer
  selector: { app: api-gateway }
  ports: [{ port: 8080, targetPort: 8080 }]
